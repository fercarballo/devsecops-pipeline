# DAST con OWASP ZAP — escaneo pasivo completo (workflow de referencia).
#
# El pipeline principal (devsecops.yml) cubre la capa dinámica con pruebas de
# seguridad dirigidas. Este workflow complementa con un escáner completo (OWASP
# ZAP baseline), que rastrea la app y reporta hallazgos de seguridad conocidos.
#
# Se dispara manualmente (workflow_dispatch). En un entorno productivo, el
# reporte de ZAP se publica como artefacto y, con una política estricta, sus
# hallazgos de nivel FAIL también actuarían como gate.
name: DAST — OWASP ZAP (referencia)

on:
  workflow_dispatch:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci

      - name: Levantar la app segura
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf "http://localhost:3000/search?q=x" && break
            sleep 1
          done

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false
